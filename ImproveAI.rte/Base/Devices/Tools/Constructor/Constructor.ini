////////////////////////////////////////////////////////////////////////
// ImproveAI Constructor override
//
// Reuses the native CCCP Constructor definition but redirects its
// behaviour script to ImproveAI's mirrored Constructor.lua.
//
// Constructor.lua forces construction to the medium 12x12 px block
// size used by MinerOptimized. The native 3x3 px cell remains an
// internal construction unit and is not exposed as a selectable size.
////////////////////////////////////////////////////////////////////////

AddDevice = HDFirearm
	CopyOf = Constructor
	PresetName = Constructor
	ScriptPath = ImproveAI.rte/Base/Devices/Tools/Constructor/Constructor.lua
