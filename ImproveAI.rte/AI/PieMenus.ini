////////////////////////////////////////////////////////////////////////
// ImproveAI Pie Menu definitions
//
// Mining is grouped into its own submenu. The Anchor submenu is kept
// separate from MinerOptimized so the anchor can be placed explicitly.
////////////////////////////////////////////////////////////////////////

AddPieMenu = PieMenu
	PresetName = ImproveAI Mining Menu
	AddPieSlice = PieSlice
		PresetName = ImproveAI Native Mining
		Description = Native Mining
		ScriptPath = ImproveAI.rte/AI/PieMenus.lua
		FunctionName = ImproveAI_StartNativeMining
	AddPieSlice = PieSlice
		PresetName = ImproveAI Optimized Mining
		Description = Optimized Mining
		ScriptPath = ImproveAI.rte/AI/PieMenus.lua
		FunctionName = ImproveAI_StartOptimizedMining
	AddPieSlice = PieSlice
		PresetName = ImproveAI Anchor
		Description = Mining Anchor
		Direction = Down
		SubPieMenu = PieMenu
			AddPieSlice = PieSlice
				PresetName = ImproveAI Anchor Left
				Description = Anchor Left
				ScriptPath = ImproveAI.rte/AI/Anchor.lua
				FunctionName = ImproveAI_AnchorPlaceLeft
			AddPieSlice = PieSlice
				PresetName = ImproveAI Anchor Right
				Description = Anchor Right
				ScriptPath = ImproveAI.rte/AI/Anchor.lua
				FunctionName = ImproveAI_AnchorPlaceRight
