////////////////////////////////////////////////////////////////////////
// ImproveAI Pie Menu definitions
//
// Mining and Sentry commands are grouped into dedicated submenus.
// Anchor placement remains separate from MinerOptimized so the player
// can explicitly define the mining origin and direction.
////////////////////////////////////////////////////////////////////////

AddPieMenu = PieMenu
	PresetName = ImproveAI Mining Menu
	AddPieSlice = PieSlice
		PresetName = ImproveAI Native Mining
		Description = Native Mining
		ScriptPath = ImproveAI.rte/AI/PieMenus.lua
		FunctionName = ImproveAI_StartNativeMining
	AddPieSlice = PieSlice
		PresetName = ImproveAI Optimized Mining
		Description = Optimized Mining
		Icon = Icon
			PresetName = ImproveAI Miner Optimized Icon
			BitmapFile = ContentFile
				FilePath = ImproveAI.rte/Icons/Pie/MinerOptimized.png
		ScriptPath = ImproveAI.rte/AI/PieMenus.lua
		FunctionName = ImproveAI_StartOptimizedMining
	AddPieSlice = PieSlice
		PresetName = ImproveAI Anchor
		Description = Mining Anchor
		Direction = Down
		Icon = Icon
			PresetName = ImproveAI Anchor Icon
			BitmapFile = ContentFile
				FilePath = ImproveAI.rte/Icons/Pie/Anchor.png
		SubPieMenu = PieMenu
			AddPieSlice = PieSlice
				PresetName = ImproveAI Anchor Left
				Description = Anchor Left
				ScriptPath = ImproveAI.rte/AI/Anchor.lua
				FunctionName = ImproveAI_AnchorPlaceLeft
			AddPieSlice = PieSlice
				PresetName = ImproveAI Anchor Right
				Description = Anchor Right
				ScriptPath = ImproveAI.rte/AI/Anchor.lua
				FunctionName = ImproveAI_AnchorPlaceRight

AddPieMenu = PieMenu
	PresetName = ImproveAI Sentry Menu
	AddPieSlice = PieSlice
		PresetName = ImproveAI Sentry Passive
		Description = Sentry Passive
		Icon = Icon
			PresetName = ImproveAI Sentry Passive Icon
			BitmapFile = ContentFile
				FilePath = ImproveAI.rte/Icons/Pie/SentryPassive.png
		ScriptPath = ImproveAI.rte/AI/PieMenus.lua
		FunctionName = ImproveAI_StartSentryPassive
	AddPieSlice = PieSlice
		PresetName = ImproveAI Sentry Active
		Description = Sentry Active
		Icon = Icon
			PresetName = ImproveAI Sentry Active Icon
			BitmapFile = ContentFile
				FilePath = ImproveAI.rte/Icons/Pie/SentryActive.png
		ScriptPath = ImproveAI.rte/AI/PieMenus.lua
		FunctionName = ImproveAI_StartSentryActive
