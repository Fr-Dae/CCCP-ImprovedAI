////////////////////////////////////////////////////////////////////////
// ImproveAI Pie Menus
//
// The mining menu contains the explicit Anchor commands used by
// MinerOptimized. Left and Right are mutually exclusive because an
// actor stores only one mining anchor.
//
// These two directions are a temporary replacement for a proper
// rotate-anchor keyboard action. They deliberately avoid registering
// a coroutine as a PieSlice callback.
////////////////////////////////////////////////////////////////////////

AddPieMenu = PieMenu
	PresetName = ImproveAI Mining Pie Menu
	AddPieSlice = PieSlice
		PresetName = ImproveAI Anchor Left
		Description = Place Mining Anchor Left
		ScriptPath = ImproveAI.rte/AI/Anchor.lua
		FunctionName = Anchor.PlaceLeft
	AddPieSlice = PieSlice
		PresetName = ImproveAI Anchor Right
		Description = Place Mining Anchor Right
		ScriptPath = ImproveAI.rte/AI/Anchor.lua
		FunctionName = Anchor.PlaceRight
