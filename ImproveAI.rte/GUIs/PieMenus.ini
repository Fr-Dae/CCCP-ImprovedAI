////////////////////////////////////////////////////////////////////////
// ImproveAI Mining menu
//
// The three mining commands are kept together so the root AI command
// menu can expose Classic, Optimized and Anchor without duplicating the
// command definitions.

AddPieMenu = PieMenu
	PresetName = ImproveAI Mining Menu
	AddPieSlice = PieSlice
		PresetName = ImproveAI Mining Classic
		Description = Mining
		ScriptPath = ImproveAI.rte/AI/Miner.lua
		FunctionName = Miner
	AddPieSlice = PieSlice
		PresetName = ImproveAI Mining Optimized
		Description = Mining Optimized
		ScriptPath = ImproveAI.rte/AI/MinerOptimized.lua
		FunctionName = MinerOptimized
	AddPieSlice = PieSlice
		PresetName = ImproveAI Mining Anchor
		Description = Anchor
		ScriptPath = ImproveAI.rte/AI/Anchor.lua
		FunctionName = ImproveAI_SetMiningAnchor
